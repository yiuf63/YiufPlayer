  --font:"DM Sans",Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;

}
:root[data-density="large"] {font-size:23px}
* {box-sizing:border-box} body {margin:0}
button,input,select {font:inherit;color:inherit}
button {cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,button:focus {outline:3px solid var(--ice);outline-offset:3px}
button {background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.47rem .8rem;min-height:2.6rem}
button:hover {background:var(--raised)}
button:disabled{opacity:.46;cursor:default}
button.primary {background:var(--ice);border-color:var(--ice);color:#12242f;font-weight:700}
button.quiet {background:#192e3e;border-color:#4a6376;color:#e3eff6}
button.back {margin-bottom:.7rem} h1,h2,h3,p,figure {margin:0}
h1,h2,h3{line-height:1.17;letter-spacing:-.038em} h1{font-size:clamp(1.8rem,3.4vw,2.9rem)} h2{font-size:1.4rem} h3{font-size:1.06rem}
#shell{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#viewport{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#4b6478 transparent}
#canvas{position:relative;isolation:isolate;min-height:100%;container-type:inline-size}
#panorama{display:none}
body[data-page="library"] #panorama{display:block;position:absolute;z-index:-1;inset:0 0 auto;height:calc(69px + clamp(200px,32vh,350px));background:linear-gradient(90deg,#101d2ae8,#122232ab 33%,#17253210 72%),linear-gradient(0deg,var(--bg),#17263291 18%,transparent 52%),linear-gradient(180deg,#0915229c,transparent 34%),var(--art,linear-gradient(120deg,#304f67,#426479));background-size:cover;background-position: center 56%}
#top,.wrap,.home-section,.hero-inner,.footer-inner{max-width:1680px;margin:auto}
#top{position:relative;min-height:69px;display:flex;align-items:center;padding:.6rem var(--pad);gap:clamp(12px,2.8vw,44px);border-bottom:1px solid #405466}
body[data-page="library"] #top{border-color:transparent}
.brand{display:flex;align-items:center;gap:.3em;white-space:nowrap;font:800 clamp(1.33rem,2.75vw,2.25rem)/1 Barlow,Inter,Arial,sans-serif;letter-spacing:-.06em}
.brand i{width:.82em;height:.74em;background:var(--ice);clip-path:polygon(0 0,45% 0,80% 50%,44% 100%,0 100%,37% 50%,69% 0,100% 50%,70% 100%,91% 50%)}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:.16rem}
nav button,.gear{background:transparent;color:#c7d8e5;border:1px solid transparent;min-height:2.5rem;font-weight:530}
nav button[aria-current="page"]{color:var(--ink);background:#263d50e6;border-color:#69879c}
.gear{margin-left:auto;color:var(--ink)} .gear:hover,nav button:hover{background:#263d50e6}
.hero{min-height:clamp(200px,32vh,350px);display:flex;align-items:end}
.hero-inner{width:100%;padding:1.8rem var(--pad) 1.35rem}
.eyebrow{font-size:.94rem;font-weight:650;color:#e1edf5}
.hero h1{font:650 clamp(2.5rem,5.35vw,5rem)/1.15 "Noto Serif SC","Songti SC",SimSun,serif;letter-spacing:-.055em;margin:.18rem 0 .65rem;overflow-wrap:anywhere}
.sub,.detail,small{color:var(--muted)} .detail{font-size:.91rem;line-height:1.55}
.timing,.actions,.head,.section-title,.hints,.album-mini{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
.timing{font-variant-numeric:tabular-nums;font-size:.94rem}.short-track{display:inline-block;width:5.6rem;height:4px;background:#cedee957;border-radius:7px;overflow:hidden}
.short-track i,.long-track i{display:block;width:var(--pct);height:100%;background:var(--ice)}
.home-section{padding:.22rem var(--pad) 1.8rem}.section-title,.head{justify-content:space-between;margin-bottom:.75rem}
.section-title button{min-height:2.32rem;padding:.28rem .65rem}
.reel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13.25rem),1fr));gap:.78rem}
.tile{display:block;padding:0;text-align:left;border:2px solid transparent;border-radius:8px;background:#263b4b;min-width:0;overflow:hidden}
.tile.selected{border-color:var(--ice);background:#315064}
.tile:focus {outline-offset:1px}
.thumb,.artbox,.poster,.album-art,.media-scene{background:var(--art,linear-gradient(115deg,#324a55,#243341)) center 55%/cover}
.thumb{height:clamp(68px,8vw,125px);display:flex;align-items:flex-end;justify-content:flex-end;padding:.4rem}
.type-tag{font-size:.74rem;padding:.1rem .39rem;border-radius:4px;background:#0d1b26dc;color:#ecf5fb}
.tile-copy{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.52rem .58rem}
.tile-copy b,.one-line{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile-copy small{font:500 .77rem var(--mono);white-space:nowrap}
.wrap{padding:1.5rem var(--pad) 2rem}.crumb{color:var(--muted);font-size:.87rem;margin-bottom:.4rem;overflow-wrap:anywhere}
.head{margin-bottom:1.15rem}.head p{margin:.4rem 0 0}.grid{display:grid;grid-template-columns:minmax(0,.67fr) minmax(0,1.45fr);gap:1.3rem;align-items:start}
.poster{aspect-ratio:1.5;border-radius:9px}.panel{background:#1d303f;border:1px solid var(--line);border-radius:9px;padding:1rem;min-width:0}
.panel h2,.panel h3{margin-bottom:.55rem}.panel .actions{margin-top:.85rem}
.stack{display:grid;gap:.52rem;min-width:0}.stack+.section-title,.stack+.head,.section-gap{margin-top:1.55rem}
.row{display:flex;align-items:center;text-align:left;gap:.8rem;width:100%;min-width:0;min-height:3.05rem;padding:.58rem .83rem;background:var(--panel)}

"use strict";

const Harbor = (() => {
  const store = "cueharbor.design.v1";
  const packs = {
    nfo:{name:"本地 NFO",kind:"metadataSource",author:"CueHarbor",origin:"本地侧车文件",builtin:true},
    atlas:{name:"海港资料库",kind:"metadataSource",author:"海港编目组",origin:"atlas.example"},
    films:{name:"海岸放映室",kind:"videoSource",author:"海岸影像社",origin:"films.example"}
  };
  const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const info = {
    local:"系统视频",sd:"旅行 SD 卡",SMB:"SMB",WebDAV:"WebDAV",NFS:"NFS",Jellyfin:"Jellyfin",plugin:"扩展片源"
  };
  function initial() {
    return {
      schema:1, serial:3, active:"local", density:"auto", lastTab:"library",
      sources:[{id:"local",kind:"local",name:"系统视频",online:true},{id:"sd",kind:"sd",name:"旅行 SD 卡",online:false}],
      packages:{nfo:{installed:true,enabled:true},atlas:{installed:true,enabled:true},films:{installed:false,enabled:false}},
      instances:[{id:"nfo-1",pack:"nfo",name:"同目录 NFO",lang:"zh-CN",collection:""},
        {id:"atlas-zh",pack:"atlas",name:"海港资料库 · 中文",lang:"zh-CN",collection:""},
        {id:"atlas-en",pack:"atlas",name:"海港资料库 · 英文",lang:"en",collection:""}],
      policies:{global:{mode:"custom",order:["nfo-1","atlas-zh","atlas-en"]},"local|recordings":{mode:"off",order:[]}},
      progress:{"local|blue":{position:756,completed:false,updated:3},"local|ep1":{position:1780,completed:true,updated:1},"local|ep2":{position:1640,completed:true,updated:2}},
      metadata:{}, batches:[]
    };
  }
  let state;
  try {const saved=JSON.parse(localStorage.getItem(store));state=saved?.schema===1 ? saved : initial();} catch {state=initial();}
  function save() {try {localStorage.setItem(store,JSON.stringify(state));} catch {/* private contexts stay in memory */}}
  function reset() {state=initial();save();}
  const src = id => state.sources.find(s=>s.id===id);
  const instance = id => state.instances.find(s=>s.id===id);
  function enabled(i) {return !!i && !!state.packages[i.pack]?.enabled;}
  function online(s) {return !!s && s.online && (s.kind!=="plugin" || enabled(instance(s.instanceId)));}
  const itemKey = (sourceId,key) => `${sourceId}|${key}`;
  const leaf = (key, parent, name, duration, art="",title="",detail="") => ({key,parent,name,duration,art,title,detail,kind:"video"});
  const dir = (key,parent,name,art="",semantic="") => ({key,parent,name,title:name,art,semantic,kind:"folder"});
  function tree(sourceId) {
    const s=src(sourceId); if(!s) return [];
    let raw=[];
    if (s.kind==="empty") return raw;
    if (s.kind==="Jellyfin") {
      raw=[dir("show","","海港手记","harbor","剧集"),dir("season","show","第一季","harbor","季"),
        leaf("blue","season","第 03 集 · 蓝调时刻",1730,"harbor","蓝调时刻","第一季 · 第 03 集"),
        leaf("coastal","","海边列车",1820,"rail","海边列车","服务器影片")];
    } else if (s.kind==="plugin") {
      const documentary=instance(s.instanceId)?.collection==="documentary";
      raw=[dir("collection","",documentary?"沿岸纪录片":"作者短片","harbor"),
        leaf("blue","collection",documentary?"港湾观察":"蓝调时刻",1730,"harbor","","授权目录"),
        leaf("walk","collection","雨后的港口",326,"rain","","授权目录")];
    } else if (s.kind==="sd") {
      raw=[dir("trip","","旅行素材","rain"),leaf("walk","trip","雨后的港口.mp4",326,"rain","雨后的港口"),leaf("ferry","trip","渡轮.mp4",330,"harbor","渡轮")];
    } else {
      raw=[dir("series","","海港手记","harbor"),dir("movies","","电影","rail"),dir("recordings","","游戏录屏"),
        leaf("ep1","series","01 开船之前.mkv",1780,"rail","开船之前","海港手记 · 第 01 集"),
        leaf("ep2","series","02 潮水的方向.mkv",1640,"rain","潮水的方向","海港手记 · 第 02 集"),
        leaf("blue","series","03 蓝调时刻.mkv",1730,"harbor","蓝调时刻","海港手记 · 第 03 集"),
        leaf("ep4","series","04 穿过港湾.mkv",1458,"rail","穿过港湾","海港手记 · 第 04 集"),
        leaf("ep5","series","05 岛上的清晨.mkv",1600,"rain","岛上的清晨","海港手记 · 第 05 集"),
        leaf("ep6","series","06 回程.mkv",1386,"harbor","回程","海港手记 · 第 06 集"),
        leaf("tideline","movies","沿岸.1080p.mkv",1712),leaf("coastal","movies","海边列车.2021.mp4",1820),
        leaf("raw","movies","MVI_0008.mp4",47),leaf("capture","recordings","山脊竞速_03.mp4",167),
        leaf("walk","","雨后的港口.mp4",326,"rain","雨后的港口","旅行素材")];
    }
    return raw.map(n=>({...n,sourceId,id:itemKey(sourceId,n.key)}));
  }
  function node(id) {const [si,key]=id.split("|");return tree(si).find(n=>n.key===key);}
  function children(si,parent="") {return tree(si).filter(n=>n.parent===parent);}
  function descendants(si,parent="",skipOverrides=false) {
    return children(si,parent).flatMap(n=>n.kind==="video"?[n]:skipOverrides && state.policies[n.id]?.mode && state.policies[n.id].mode!=="inherit"?[]:descendants(si,n.key,skipOverrides));
  }
  function mark(id) {return state.progress[id] || {position:0,completed:false,updated:0};}
  function latest(items) {return items.filter(n=>n.kind==="video" && mark(n.id).position>0 && !mark(n.id).completed).sort((a,b)=>mark(b.id).updated-mark(a.id).updated)[0];}
  function sourceScope(si) {return itemKey(si,"");}
  function policyAt(scope) {
    if (scope==="global") return {scope,policy:state.policies.global};
    let [si,key]=scope.split("|");
    while(key) {
      const k=itemKey(si,key), p=state.policies[k]; if(p && p.mode!=="inherit") return {scope:k,policy:p};
      key=node(k)?.parent || "";
    }
    const k=sourceScope(si),p=state.policies[k];
    return p && p.mode!=="inherit" ? {scope:k,policy:p} : {scope:"global",policy:state.policies.global};
  }
  function scopeName(scope) {
    if(scope==="global") return "全局默认";
    const [id,key]=scope.split("|");
    return key?`${src(id)?.name} / ${node(scope)?.name}`:src(id)?.name || "媒体来源";
  }
  const labels={title:"片名",year:"年份",overview:"简介",cover:"封面"};
  function defaults(n) {return {title:n.title || n.name.replace(/\.[^.]+$/,""),year:"",overview:"",cover:n.art || ""};}
  function field(n,k) {
    return state.metadata[n.id]?.[k] ?? {value:defaults(n)[k],rev:0,locked:false,origin:"原文件"};
  }
  const title=n=>n.kind==="folder"?n.name:field(n,"title").value;
  const artwork=n=>n.kind==="folder"?n.art:field(n,"cover").value;
  function setField(n,k,value,origin,locked=false) {
    state.metadata[n.id] ||= {};
    state.metadata[n.id][k]={value,origin,locked,rev:++state.serial};
  }
  function matches(n,inst) {
    const en=inst.lang==="en"; let records=[];
    if(inst.pack==="nfo" && n.key==="coastal") records=[["nfo-train","海边列车","2021","穿越海岸山脉的慢车。","rail"]];
    if(inst.pack==="atlas" && n.key==="coastal") records=[["train-2021",en?"Coastal Train":"海边列车","2021",en?"A journey along the coast.":"沿海岸线行驶的一班列车。","rail"]];
    if(inst.pack==="atlas" && n.key==="tideline") records=[
      ["shore-2019",en?"Shoreline":"沿岸","2019",en?"A walk through the old port.":"一段关于老港口的旅行记录。","rain"],
      ["shore-2023",en?"Shoreline":"沿岸","2023",en?"The last crossing at blue hour.":"蓝调时分，渡轮最后一次穿过海湾。","harbor"]];
    if(inst.pack==="atlas" && n.key==="blue") records=[["harbor-03",en?"Blue Hour":"蓝调时刻","2024",en?"A ferry returns at dusk.":"傍晚返回港口的渡轮。","harbor"]];
    return records.map(([id,title,year,overview,cover])=>({id,provider:inst.id,title,year,overview,cover}));
  }
  function fingerprint(scope,ids) {
    const effective=policyAt(scope);
    const [si,key]=scope.split("|");
    return JSON.stringify([effective,online(src(si)),descendants(si,key,true).map(n=>n.id),effective.policy.order.map(id=>[instance(id),enabled(instance(id))]),ids.map(id=>state.metadata[id]||{})]);
  }
  function preview(scope) {
    const [si,key]=scope.split("|");
    const {policy}=policyAt(scope);
    const items=descendants(si,key,true);
    const rows=items.map(n=>{
      let candidates=[],provider="";
      if(policy.mode!=="off") for(const id of policy.order) {
        const inst=instance(id); if(!enabled(inst)) continue;
        candidates=matches(n,inst);
        if(candidates.length) {provider=id;break;}
      }
      return {id:n.id,candidates,provider,pick:candidates.length===1?candidates[0].id:""};
    });
    return {scope,rows,stamp:fingerprint(scope,rows.map(r=>r.id)),used:false};
  }
  function changes(row) {
    const n=node(row.id),c=row.candidates.find(c=>c.id===row.pick);
    if(!c || !n) return [];
    return Object.keys(labels).map(k=>({key:k,before:{...field(n,k)},after:c[k],origin:instance(c.provider)?.name || c.provider})).filter(diff=>diff.before.value!==diff.after && diff.after!=="");
  }
  function apply(batch) {
    if(batch.used || batch.stamp!==fingerprint(batch.scope,batch.rows.map(r=>r.id))) throw Error("配置或资料已改变，请重新预览。");
    const applied=[];
    for(const row of batch.rows) for(const diff of changes(row)) {
      if(diff.before.locked) continue;
      const n=node(row.id);setField(n,diff.key,diff.after,diff.origin);
      applied.push({id:n.id,key:diff.key,before:diff.before,rev:field(n,diff.key).rev});
    }
    batch.used=true;
    if(applied.length) state.batches.unshift({id:uid(),scope:batch.scope,at:Date.now(),changes:applied,undone:false});
    save();return applied.length;
  }
  function undo(batchId) {
    const batch=state.batches.find(b=>b.id===batchId);let restored=0,conflicts=0;
    if(!batch || batch.undone) return {restored,conflicts};
    for(const c of batch.changes) {
      const n=node(c.id);
      if(!n || field(n,c.key).rev!==c.rev) {conflicts++;continue;}
      setField(n,c.key,c.before.value,c.before.origin,c.before.locked);restored++;
    }
    batch.undone=true;save();return {restored,conflicts};
  }
  return {get state(){return state;},save,reset,src,info,packs,instance,enabled,online,uid,tree,node,children,descendants,latest,mark,title,artwork,
    sourceScope,policyAt,scopeName,labels,field,setField,preview,changes,apply,undo};
})();

"use strict";

// Three short original sound studies. The prototype needs no album, network or media permissions.
window.makeMusic = function makeMusic(onChange, onError) {
  const tracks = [
    { name: "雨后的石阶", notes: [62, 69, 72, 76, 74, 69, 67, 64] },
    { name: "码头灯火", notes: [55, 62, 67, 71, 69, 66, 62, 59] },
    { name: "末班渡船", notes: [57, 64, 69, 72, 71, 67, 64, 60] }
  ];
  let ctx, level, timer, current = 0, step = 0, playing = false, generation = 0;
  function stopSound() {
    clearTimeout(timer);
    if (level && ctx) {
      level.gain.cancelScheduledValues(ctx.currentTime);
      level.gain.setTargetAtTime(0, ctx.currentTime, .016);
      const old = level;
      setTimeout(() => old.disconnect(), 120);
      level = null;
    }
  }
  function pause() {
    generation++;
    stopSound();
    if (playing) { playing = false; onChange(); }
  }
  async function play(index, restart) {
    stopSound();
    const request = ++generation;
    if (current !== index || restart) step = 0;
    current = index;
    try {
      ctx ||= new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      if (request !== generation) return;
      level = ctx.createGain();
      level.gain.value = .13;
      level.connect(ctx.destination);
      playing = true;
      onChange();
      function pulse() {
        if (request !== generation) return;
        if (step >= 16) {
          step = 0;
          if (current < tracks.length - 1) play(current + 1, true);
          else pause();
          return;
        }
        const osc = ctx.createOscillator(), env = ctx.createGain(), now = ctx.currentTime;
        const note = tracks[current].notes[step % 8] + (step >= 8 ? 12 : 0);
        osc.type = "sine";
        osc.frequency.value = 440 * 2 ** ((note - 69) / 12);
        env.gain.setValueAtTime(.001, now);
        env.gain.exponentialRampToValueAtTime(.62, now + .035);
        env.gain.exponentialRampToValueAtTime(.001, now + .58);
        osc.connect(env); env.connect(level); osc.start(now); osc.stop(now + .6);
        osc.onended = () => { osc.disconnect(); env.disconnect(); };
        step++;
        timer = setTimeout(pulse, 540);
      }
      pulse();
    } catch { pause(); onError("当前浏览器无法启动音频"); }
  }
  function dispose() {
    pause();
    const context = ctx;
    ctx = null;
    if (context && context.state !== "closed") context.close().catch(() => {});
  }
  return { tracks, play, pause, dispose, get index() { return current; }, get playing() { return playing; } };
};

  return `<div class="head"><div><h1>${escapeText(title)}</h1>${description?`<p class="detail">${escapeText(description)}</p>`:""}</div><div class="actions">${actions}</div></div>`;
}
const opts=(options,selected)=>options.map(([id,label])=>`<option value="${escapeText(id)}"${id===selected?" selected":""}>${escapeText(label)}</option>`).join("");
const select=(id,label,options,selected)=>`<label class="field">${escapeText(label)}<select id="${id}">${opts(options,selected)}</select></label>`;
const input=(id,label,value,max=64)=>`<label class="field">${escapeText(label)}<input id="${id}" maxlength="${max}" value="${escapeText(value)}" autocomplete="off"></label>`;
const sourceName = si => H.src(si)?.name || "媒体来源";

const scopePolicy = scope => {
  const {scope:from,policy}=H.policyAt(scope);
  return policy.mode==="off"?"刮削已关闭":`${from===scope?"自定义":"继承"+H.scopeName(from)} · ${policy.order.map(id=>H.instance(id)?.name).filter(Boolean).join(" → ")||"尚未选择资料源"}`;
};
function tile(n,isResume) {
  const folder=n.kind==="folder", art=H.artwork(n), count=folder?H.descendants(n.sourceId,n.key).length:0;
  const tag=folder?(n.semantic||"文件夹"):isResume?"继续观看":(n.name.split(".").length>1?n.name.split(".").at(-1).toUpperCase():"影片");
  const subtitle=folder?`${count} 项`:timecode(n.duration);
  return btn("card-"+n.id,"open-node",`<span class="thumb" style="${artCSS(art)}"><span class="type-tag">${escapeText(tag)}</span></span><span class="tile-copy"><b>${escapeText(H.title(n))}</b><small>${subtitle}</small></span>`,n.id,"tile");

function heroContent(n) {
  const mark=H.mark(n.id), folder=n.kind==="folder";
  const top=folder?`${sourceName(n.sourceId)} / ${n.semantic||"文件夹"}`:n.detail || (n.parent?`${sourceName(n.sourceId)} / ${H.node(n.sourceId+"|"+n.parent)?.name}`:sourceName(n.sourceId));

    (mark.position && !mark.completed?`<span class="short-track"><i style="--pct:${Math.min(100,100*mark.position/n.duration)}%"></i></span>看到 ${timecode(mark.position)} / ${timecode(n.duration)}`:`时长 ${timecode(n.duration)}${mark.completed?"　·　已看完":""}`);
  const caption=H.artwork(n) || folder?H.title(n):n.name;

function libraryView(r) {
  const s=H.src(H.state.active), items=H.children(s.id), resume=H.latest(H.descendants(s.id));

function folderView(r) {

function sourcesView() {

function sourceView(r) {
  const s=H.src(r.id),effective=H.online(s);

    (s.kind==="local"?"":btn("connection-switch","toggle-online",s.online?"模拟离线":"模拟重连",s.id,"quiet",s.kind==="plugin"&&!H.enabled(H.instance(s.instanceId))))+

  return {html:wrap(backButton()+head(s.name,(H.info[s.kind]||"本机目录")+" · "+(effective?"可用":"离线／停用"))+`<div class="panel"><div class="stack"><p>${escapeText(s.location|| (s.kind==="local"?"系统视频目录":"可移动存储"))}</p><p class="detail">${escapeText(scopePolicy(H.sourceScope(s.id)))}</p><div class="actions">${actions}</div></div></div>`),key:effective?"browse":"src-policy"};
}
function extensionView() {
  return {html:wrap(head("扩展","视频源提供可播放的条目，刮削源提供影片资料。",btn("global","policy","全局刮削策略","global"))+["videoSource","metadataSource"].map(k=>`<div class="section-title section-gap"><h2>${k==="videoSource"?"视频源":"刮削源"}</h2></div><div class="stack">${Object.entries(H.packs).filter(([,p])=>p.kind===k).map(([id,p])=>{
    const status=H.state.packages[id];return row("pack-"+id,"package",p.name,`${p.author} · ${p.origin}`,status.enabled?"已启用 ›":status.installed?"已停用 ›":"工坊样例 ›",id,"",k==="videoSource"?"源":"资料");
  }).join("")}</div>`).join("")),key:"pack-films"};
}
function packageView(r) {
  const id=r.id,p=H.packs[id],status=H.state.packages[id],instances=H.state.instances.filter(i=>i.pack===id);
  const toggle=p.builtin?"":btn("switch-package",status.enabled?"disable-pack":"enable-dialog",status.enabled?"停用插件":status.installed?"启用插件":"订阅并启用",id,status.enabled?"quiet":"primary");
  const actions=toggle+(status.enabled?btn("new-instance","instance-form","＋ 新建实例",id,"primary"):"");
  return {html:wrap(backButton()+head(p.name,`${p.author} · ${p.kind==="videoSource"?"视频源":"刮削源"}`,actions)+`<div class="panel"><p>${p.kind==="videoSource"?"读取作者授权的目录并解析播放地址。":p.builtin?"从视频同目录的 NFO 读取片名、年份、简介与封面。":"按片名与年份查候选作品，选定后获取资料。"}</p><p class="detail">访问范围　${escapeText(p.origin)}</p></div><div class="section-title section-gap"><h2>配置实例</h2></div><div class="stack">${instances.map(i=>row("instance-"+i.id,"instance-form",i.name,`${i.lang}${i.collection?" · "+i.collection:""}`,"编辑 ›","edit:"+i.id,"","⚙")).join("")||"<p class='detail'>启用插件后创建配置实例，可分别设置语言或目录。</p>"}</div>`),key:status.enabled?"new-instance":"switch-package"};
}
function policyView(r) {
  const found=H.policyAt(r.id),draft=r.draft || (r.draft=structuredClone(H.state.policies[r.id]||{mode:"inherit",order:[...found.policy.order]}));
  const metas=H.state.instances.filter(i=>H.packs[i.pack].kind==="metadataSource");
  const modes=r.id==="global"?[["custom","自定义"],["off","关闭"]]:[["inherit","继承上级"],["custom","自定义"],["off","关闭"]];
  const modeForm=select("policy-mode","此范围的刮削方式",modes,draft.mode);
  const ordered=draft.order.map((id,i)=>{const inst=H.instance(id);return `<div class="meta-card"><div class="head"><span>${i+1}. ${escapeText(inst?.name||id)} <small>${H.enabled(inst)?"":"已停用"}</small></span><div class="actions">${btn("up-"+i,"priority-up","上移",String(i),"quiet",i===0)}${btn("remove-"+i,"priority-drop","移除",String(i),"quiet")}</div></div></div>`;}).join("");
  const available=metas.filter(i=>!draft.order.includes(i.id));
  const edit=draft.mode==="custom"?`<h2>查询优先级</h2>${ordered||"<p class='detail'>选择至少一个资料源实例。</p>"}${available.length?`<div class="actions">${available.map(i=>btn("add-"+i.id,"priority-add","＋ "+escapeText(i.name),i.id)).join("")}</div>`:""}`:`<p class="detail">${draft.mode==="off"?"此范围只保留当前资料和原文件名。":"实际策略取自最近的上级目录或来源。"}</p>`;
  const valid=draft.mode!=="custom"||draft.order.length>0;
  const undo=H.state.batches.find(b=>b.scope===r.id&&!b.undone);
  return {html:wrap(backButton()+head("刮削设置",H.scopeName(r.id))+`<div class="stack panel">${modeForm}${edit}<div class="actions">${btn("save-policy","save-policy","保存策略","","",!valid)}${r.id!=="global"?btn("preview","preview","保存并预览","","primary",!valid||draft.mode==="off"):""}${undo?btn("undo","undo","撤销上次资料变更",undo.id):""}</div></div>`),key:"policy-mode"};
}
const displayValue=(key,value)=>!value?"空":key==="cover"?({harbor:"渡轮剧照",rail:"沿海列车",rain:"雨后港口"}[value]||value):value;
function reviewView(r) {
  const changes=r.batch.rows.flatMap(H.changes).filter(d=>!d.before.locked).length;
  const rows=r.batch.rows.map(result=>{
    const n=H.node(result.id), c=result.candidates.find(x=>x.id===result.pick), diffs=H.changes(result);
    const status=!result.candidates.length?"未匹配，跳过":!c?"待选择":c.title+" · "+c.year;
    return `<div class="meta-card"><div class="head"><div><h3>${escapeText(n.name)}</h3><p class="tagline">${escapeText(status)}${result.provider?"　·　"+escapeText(H.instance(result.provider)?.name):""}</p></div>${result.candidates.length?btn("match-"+n.key,"pick-match",result.candidates.length>1?"选择候选":"查看候选",n.id,"quiet"):""}</div>${c?(diffs.length?diffs.map(d=>`<p class="diff"><b>${H.labels[d.key]}</b>　<del>${escapeText(displayValue(d.key,d.before.value))}</del> → ${escapeText(displayValue(d.key,d.after))}${d.before.locked?"　·　已锁定，跳过":""}</p>`).join(""):"<p class='detail'>现有字段与候选一致。</p>"):""}</div>`;
  }).join("");
  return {html:wrap(backButton()+head("匹配预览",H.scopeName(r.batch.scope)+" · 只写入已选择的资料",btn("apply","apply","应用 "+changes+" 个字段","","primary",!changes))+rows),key:r.batch.rows.some(row=>row.candidates.length>1)?"match-"+H.node(r.batch.rows.find(row=>row.candidates.length>1).id).key:"apply"};
}
function musicView() {
  return {html:wrap(head("沿岸录音","本地专辑 · 3 首原创合成试音")+`<div class="grid"><div class="album-art" style="${artCSS("rain")}"></div><div class="stack"><h2>播放队列</h2>${music.tracks.map((t,i)=>row("song-"+i,"song",t.name,"",i===music.index&&music.playing?"正在播放":"0:09",String(i),"",String(i+1).padStart(2,"0"))).join("")}<div class="actions">${btn("music-toggle","music-toggle",music.playing?"暂停":"播放","","primary")}${btn("music-next","music-next","下一首")}</div></div></div>`),key:"song-"+music.index};

  <script>
"use strict";

const stage=document.querySelector("#stage"),viewport=document.querySelector("#viewport"),dialog=document.querySelector("#dialog");
const byId=id=>document.getElementById(id);
const tabs=["library","sources","extensions","music"];
let routes=[{kind:"library"}], dialogs=[], returnKey="", player=null, toastTimer;
const current=()=>routes[routes.length-1];
const topDialog=()=>dialogs[dialogs.length-1];
const music=window.makeMusic(()=>{
  if(current().kind==="music") render(document.activeElement?.dataset.key || "music-toggle");
  else drawFooter();
},notify);
function notify(message) {
  byId("toast").textContent=message;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>byId("toast").textContent="",2900);
}
function focusKey(key) {
  const root=dialog.open?dialog:document, items=[...root.querySelectorAll("button:not(:disabled),input,select")].filter(el=>el.getClientRects().length);
  const target=items.find(el=>el.dataset.key===key || el.id===key) || (dialog.open?items.find(el=>el.closest(".dialog-inner")):items.find(el=>el.closest("main"))) || items[0];
  if(target){target.focus({preventScroll:true});target.scrollIntoView({block:"nearest",inline:"nearest"});}
}
function remember() {current().lastFocus=dialog.open?returnKey:document.activeElement?.dataset.key || document.activeElement?.id;current().scroll=viewport.scrollTop;}
function go(kind,id="",extra={}) {remember();closeDialogs(false);routes.push({kind,id,...extra});render();}
function tab(kind) {closeDialogs(false);routes=[{kind}];render();}
function back() {
  if(dialog.open){
    const previous=dialogs.pop();
    if(dialogs.length) drawDialog(previous.from);
    else closeDialogs(true);
    return;
  }
  if(routes.length>1){routes.pop();render(current().lastFocus);}
  else if(current().kind!=="library") tab("library");
  else focusKey("nav-library");
}
function drawFooter() {
  const r=current(),section=({library:sourceName(H.state.active),folder:r.id?H.node(r.id)?.name:"",sources:"来源管理",source:"来源详情",extensions:"扩展管理",package:"配置实例",policy:"目录与资料",review:"候选资料",music:"音乐队列"})[r.kind]||"";
  byId("foot-context").innerHTML=music.playing&&r.kind!=="music"?btn("mini","mini","♫　"+escapeText(music.tracks[music.index].name),"","album-mini"):escapeText(section);
  const label=r.kind==="library"&&r.selected?(H.node(r.selected)?.kind==="folder"?"打开目录":H.mark(r.selected).position&&!H.mark(r.selected).completed?"继续播放":"播放"):"确定";
  byId("foot-actions").innerHTML=`<span class="hints"><span><kbd>A</kbd>${label}</span><span><kbd>B</kbd>返回</span><span><kbd>Y</kbd>来源</span></span>`;
}
const viewers={library:libraryView,folder:folderView,sources:sourcesView,source:sourceView,extensions:extensionView,package:packageView,policy:policyView,review:reviewView,music:musicView};
function highlight(n) {
  if(!n || current().kind!=="library" || !stage.querySelector(".hero"))return;

  stage.querySelector(".hero").innerHTML=heroContent(n);

  stage.querySelectorAll(".tile").forEach(el=>el.classList.toggle("selected",el.dataset.val===n.id));
  drawFooter();
}
function render(key) {
  if(player && current().kind!=="player") stopPlayer();
  const r=current();
  document.body.dataset.page=r.kind;
  document.documentElement.dataset.density=H.state.density;
  const area=r.kind==="folder"||r.kind==="player"?"library":r.kind==="source"?"sources":r.kind==="package"?"extensions":r.kind==="policy"||r.kind==="review"?routes[0].kind:r.kind;
  document.querySelectorAll("nav button").forEach(el=>{if(area===el.dataset.val)el.setAttribute("aria-current","page");else el.removeAttribute("aria-current");});
  if(r.kind==="player"){drawPlayer(r.id);return;}
  const v=viewers[r.kind](r);stage.innerHTML=v.html;
  viewport.scrollTop=r.scroll||0;
  byId("panorama").style.cssText="";
  if(r.kind==="library"&&r.selected)highlight(H.node(r.selected));
  stage.setAttribute("aria-label",({library:"视频库",folder:"目录",sources:"媒体来源",source:"来源详情",extensions:"扩展",package:"扩展详情",policy:"刮削设置",review:"匹配预览",music:"音乐"})[r.kind]);
  drawFooter();focusKey(key||v.key);
}
function openNode(id) {
  const n=H.node(id);
  if(!n || !H.online(H.src(n.sourceId))){notify("来源离线，请检查媒体来源");return;}
  if(n.kind==="folder")go("folder",id);
  else{if(music.playing)music.pause();go("player",id);}

function browse(si) {H.state.active=si;H.save();tab("library");}
function openDialog(kind,val="",extra={}) {

function closeDialogs(restore=true) {

      btn("global","policy","全局刮削策略","global")+btn("tour","tour","原型体验说明")+btn("reset","reset-dialog","重置本地演示数据","","quiet"),"density"];

    case "reset":return ["重置演示数据","<p>恢复初始片库、配置与观看进度。</p>"+btn("confirm-reset","reset","重置演示","","primary"),"dismiss"];
    case "remove-source":return ["移出片库",`<p>移除「${escapeText(sourceName(v))}」的来源入口。原始媒体仍保存在设备上。</p>`+btn("confirm-remove","confirm-remove","移出此来源",v,"primary"),"dismiss"];
    case "pick-source":return ["切换媒体来源",H.state.sources.map(s=>row("choose-"+s.id,"browse-source",s.name,H.info[s.kind]||"本地目录",H.online(s)?"可用":"离线",s.id,"","源")).join("")+btn("manage-sources","tab","管理媒体来源","sources"),"choose-"+H.state.active];
    case "add-source":return ["添加媒体来源",[
      row("choose-local","connect","本机目录或 SD 卡","选择要扫描的目录","","local","","SSD"),
      row("choose-share","source-types","共享文件夹","局域网目录 · SMB、WebDAV、NFS","","shares","","NET"),
      row("choose-server","source-types","影视服务器","已整理的媒体库与观看进度","","servers","","库"),
      row("choose-plugin","source-types","插件提供的视频源","已启用实例或工坊样例","","plugins","","源")
    ].join(""),"choose-local"];
    case "types":{
      if(v==="plugins"){
        const list=H.state.instances.filter(i=>H.enabled(i)&&H.packs[i.pack].kind==="videoSource");
        return ["选择视频源实例",list.map(i=>row("choose-"+i.id,"connect",i.name,i.collection,"","plugin:"+i.id,"","源")).join("")+btn("to-extensions","package","管理海岸放映室","films"),list[0]?"choose-"+list[0].id:"to-extensions"];
      }
      const types=v==="shares"?["SMB","WebDAV","NFS"]:["Jellyfin"];
      return ["选择连接方式",types.map(type=>row("choose-"+type,"connect",type,v==="shares"?"保留共享目录层级":"沿用服务器季集和用户进度","",type,"",v==="shares"?"NET":"库")).join(""),"choose-"+types[0]];
    }
    case "connect":{
      const inst=v.startsWith("plugin:")?H.instance(v.slice(7)):null,local=v==="local",server=v==="Jellyfin";
      const name=inst?inst.name:local?"我的视频目录":server?"家庭影院":"客厅 NAS";
      return [local?"添加本机目录":"配置 "+(inst?"视频源":v),"<p class='detail'>使用演示地址和示例授权，预览连接后的片库。</p>"+
        input("source-name","来源名称",d.name??name)+(inst?`<p>配置实例　${escapeText(inst.name)}</p>`:input("source-address",local?"示例目录":"示例设备地址",d.address??(local?"/media/Video":server?"cinema.home.example":"storage.home.example")))+
        (!local&&!inst?select("source-auth","授权方式",[["guest","访客"],["demo","示例账号"]],d.auth||"guest"):"")+
        select("source-root",server?"媒体库":inst?"目录":"选择目录",local?[["media","有示例影片的目录"],["empty","空目录"]]:server?[["travel","旅行影库"]]:inst?[[inst.collection,inst.collection==="documentary"?"纪录片":"作者短片"]]:[["movies","Movies"]],d.root)+
        btn("test-source","test-source",local?"预览目录":"测试示例连接","","primary"),"source-name"];
    }
    case "connect-review":return ["确认添加",`<p><b>${escapeText(d.config.name)}</b></p><p class="detail">${escapeText(d.config.location)}</p><p>已读取${d.config.kind==="empty"?"空目录":d.config.kind==="Jellyfin"?"服务器季集与影片":"示例目录及视频"}。</p>`+btn("add-confirm","attach","添加到片库","","primary"),"add-confirm"];
    case "enable":{
      const p=H.packs[v];
      return ["启用 "+p.name,`<div class="stack"><p>作者　${escapeText(p.author)}</p><p>允许访问　${escapeText(p.origin)}</p><p>能力　${p.kind==="videoSource"?"读取授权目录、解析播放地址":"查询候选、读取影视资料"}</p><p class="detail">工坊订阅、下载与权限确认使用本地示例。</p></div>`+btn("grant","grant","确认并启用",v,"primary"),"grant"];
    }
    case "instance":{
      const edit=v.startsWith("edit:"), inst=edit?H.instance(v.slice(5)):null, pid=inst?.pack||v,p=H.packs[pid];
      return [edit?"编辑配置实例":"新建配置实例",input("instance-name","实例名称",inst?.name||p.name)+select("instance-lang","语言",[["zh-CN","简体中文"],["en","English"]],inst?.lang||"zh-CN")+
        (p.kind==="videoSource"?select("instance-collection","默认内容目录",[["shorts","作者短片"],["documentary","纪录片"]],inst?.collection||"shorts"):"")+
        (pid==="atlas"?select("instance-account","凭据引用",[["none","无需账号"],["demo","示例账号"]],inst?.account||"none"):"")+
        btn("save-instance","save-instance","保存实例",v,"primary"),"instance-name"];
    }
    case "matches":{
      const result=current().batch.rows.find(x=>x.id===v);
      return ["选择对应作品",result.candidates.map(c=>row("candidate-"+c.id,"adopt",`${c.title}（${c.year}）`,c.overview,result.pick===c.id?"已选择":"",c.id,c.cover)).join("")+btn("skip","adopt","跳过此文件",""),result.pick?"candidate-"+result.pick:undefined];
    }
    case "apply":return ["应用资料",`<p>将选定字段写入「${escapeText(H.scopeName(current().batch.scope))}」的本地片库，可在刮削设置中撤销。</p>`+btn("confirm-apply","commit","确认应用","","primary"),"confirm-apply"];
    case "item":{
      const n=H.node(v),field=H.field(n,"title");
      return [n.name,`<p class="detail">${escapeText(sourceName(n.sourceId))}　·　${timecode(n.duration)}　·　片名来自 ${escapeText(field.origin)}</p>`+
        input("manual-title","展示片名",field.value)+`<label class="check"><input id="lock-title" type="checkbox"${field.locked?" checked":""}>锁定片名，刮削时保留</label>`+
        btn("save-field","save-field","保存片名",v,"primary"),"manual-title"];
    }
    case "track":return ["字幕与音轨",select("subtitle","字幕",[["zh","简体中文 · 示例"],["off","关闭"]],player.sub)+select("audio-track","音轨",[["original","原声"],["commentary","讲评 · 示例"]],player.audio)+
      select("caption-size","字号",[["1","标准"],["1.3","大字"]],player.subSize)+select("caption-delay","字幕延迟",[["0","同步"],["-0.5","提前 0.5 秒"],["0.5","延后 0.5 秒"]],player.delay)+btn("track-save","save-tracks","应用","","primary"),"subtitle"];
    case "rate":return ["播放速度",[.75,1,1.25,1.5,2].map(x=>btn("rate-"+x,"set-rate",`${x}×`,String(x),player.rate===x?"primary":"quiet")).join(""),"rate-"+player.rate];
    case "ended":{
      const n=H.node(player.id),siblings=H.children(n.sourceId,n.parent).filter(x=>x.kind==="video"),next=siblings[siblings.findIndex(x=>x.id===n.id)+1];
      return ["播放结束",(next?btn("next-episode","next-episode","播放下一条 · "+escapeText(H.title(next)),next.id,"primary"):"")+btn("exit-player","exit-player","返回片库")+btn("replay","replay","重新播放"),next?"next-episode":"exit-player"];
    }
  }
  return ["选项",""];

function useSourceDraft() {
  const d=topDialog(),v=d.val,inst=v.startsWith("plugin:")?H.instance(v.slice(7)):null;
  const name=byId("source-name").value.trim(),addr=byId("source-address")?.value.trim();
  if(!name||(!inst&&!addr)){notify("填写来源名称和位置后继续");return;}
  d.name=name;d.address=addr;d.root=byId("source-root").value;d.auth=byId("source-auth")?.value;
  const rootName=byId("source-root").selectedOptions[0].textContent;
  const config={id:H.uid(),kind:inst?"plugin":d.root==="empty"?"empty":v==="local"?"picked":v,name,online:true,location:inst?`${H.packs[inst.pack].origin} / ${rootName}`:v==="local"?addr:`${addr} / ${rootName}`};
  if(inst)config.instanceId=inst.id;
  openDialog("connect-review","",{config});
}
function savePolicy(thenPreview) {
  const r=current();
  H.state.policies[r.id]=structuredClone(r.draft);H.save();
  if(!thenPreview){notify("已保存刮削策略");render("save-policy");return;}
  if(H.policyAt(r.id).policy.mode==="off"){notify("此范围已关闭刮削");return;}
  const [si]=r.id.split("|");
  if(!H.online(H.src(si))){notify("来源离线，请重连后预览");return;}
  go("review","",{batch:H.preview(r.id)});
}
function saveInstance(value) {
  const inst=value.startsWith("edit:")?H.instance(value.slice(5)):null;
  const pack=inst?.pack || value,name=byId("instance-name").value.trim();
  if(!name){notify("请填写实例名称");return;}
  const data={id:inst?.id||H.uid(),pack,name,lang:byId("instance-lang").value,collection:byId("instance-collection")?.value||"",account:byId("instance-account")?.value||"none"};
  if(inst)Object.assign(inst,data);else H.state.instances.push(data);
  H.save();closeDialogs(false);render("instance-"+data.id);notify("实例已保存");
}

function drawPlayer(id) {
  const n=H.node(id),mark=H.mark(id);
  if(player?.id!==id){
    stopPlayer();
    player={id,position:mark.completed?0:mark.position,duration:n.duration,rate:1,playing:true,at:performance.now(),saved:Date.now(),ended:false,sub:"zh",subSize:"1",delay:"0",audio:"original",hidden:false};
  }
  const p=player;
  stage.innerHTML=`<div class="media-scene" style="${artCSS(H.artwork(n))}"><div class="player-top">${btn("player-back","back","‹　返回","","quiet")}<small>示例截帧 · 播放控制预览</small></div><p class="sample-sub">渡轮转过弯，岸上的灯刚刚亮起来。</p><div class="osd"><h1>${escapeText(H.title(n))}</h1><div class="long-track"><i id="play-fill"></i></div><div class="actions">${btn("play-toggle","play-toggle","暂停","","primary")}${btn("seek-back","seek","−10 秒","-10")}${btn("seek-forward","seek","+10 秒","10")}${btn("tracks","tracks","字幕 / 音轨")}${btn("rate","rate","倍速")}<span id="clock" class="detail"></span></div></div></div>`;
  updatePlayer();focusKey("play-toggle");revealPlayer();
  if(!p.timer)p.timer=setInterval(tickPlayer,200);
}
function recordPlayer() {
  if(!player)return;
  H.state.progress[player.id]={position:Math.floor(player.position),completed:player.ended,updated:Date.now()};H.save();
}
function tickPlayer() {
  const p=player;if(!p)return;
  const now=performance.now();
  if(p.playing)p.position+=((now-p.at)/1000)*p.rate;
  p.at=now;
  if(p.position>=p.duration&&!p.ended){
    p.position=p.duration;p.playing=false;p.ended=true;recordPlayer();revealPlayer();openDialog("ended");}
  if(p.playing&&Date.now()-p.saved>=5000){recordPlayer();p.saved=Date.now();}
  updatePlayer();
}
function updatePlayer() {
  const p=player;if(!p || !byId("clock"))return;
  byId("clock").textContent=`${timecode(p.position)} / ${timecode(p.duration)}`;
  byId("play-fill").style.setProperty("--pct",Math.min(100,p.position/p.duration*100)+"%");
  const toggle=stage.querySelector('[data-key="play-toggle"]');toggle.textContent=p.playing?"暂停":p.ended?"重播":"播放";
  const sample=stage.querySelector(".sample-sub");sample.hidden=p.sub==="off";sample.style.fontSize=`${1.33*Number(p.subSize)}rem`;
  stage.querySelector('[data-key="rate"]').textContent=p.rate===1?"倍速":p.rate+"×";
}
function revealPlayer() {
  if(!player)return;
  clearTimeout(player.hideTimer);player.hidden=false;stage.querySelector(".media-scene")?.classList.remove("clean");
  if(player.playing&&!dialog.open)player.hideTimer=setTimeout(()=>{if(player?.playing&&!dialog.open){player.hidden=true;stage.querySelector(".media-scene")?.classList.add("clean");}},3700);
}
function stopPlayer() {
  if(!player)return;
  recordPlayer();clearInterval(player.timer);clearTimeout(player.hideTimer);player=null;
}
function playToggle() {
  if(!player)return;
  if(player.ended){player.position=0;player.ended=false;}
  player.playing=!player.playing;player.at=performance.now();recordPlayer();updatePlayer();revealPlayer();
}
function seek(delta) {
  player.ended=false;player.position=Math.max(0,Math.min(player.duration-.05,player.position+delta));
  player.at=performance.now();recordPlayer();updatePlayer();revealPlayer();
}
function contextAction() {
  if(dialog.open)return;
  const r=current(),key=document.activeElement?.dataset.val;
  if(r.kind==="player"){openDialog("track");return;}
  if(r.kind==="folder"||r.kind==="library"){
    const n=H.node(key||r.selected||"");
    if(n?.kind==="video")openDialog("item",n.id);
    else if(n)go("policy",n.id);
    else if(r.kind==="folder")go("policy",r.id);
  }
}
function act(action,val) {
  const r=current();
  switch(action) {
    case "back":back();break;
    case "tab":tab(val);break;
    case "open-node":openNode(val);break;
    case "source-detail":go("source",val);break;
    case "browse-source":browse(val);break;
    case "settings":case "tour":case "pick-source":case "add-source":openDialog(action,val);break;
    case "source-types":openDialog("types",val);break;
    case "connect":openDialog("connect",val);break;
    case "test-source":useSourceDraft();break;
    case "attach":{
      const s=topDialog().config;H.state.sources.push(s);
      if(s.kind==="Jellyfin")H.state.progress[s.id+"|blue"]={position:102,updated:Date.now(),completed:false};
      H.save();browse(s.id);notify("来源已加入片库");break;
    }
    case "toggle-online":{const s=H.src(val);s.online=!s.online;H.save();render("connection-switch");notify(s.online?"已恢复示例连接":"来源已离线，保留索引与进度");break;}
    case "remove-source":openDialog("remove-source",val);break;
    case "confirm-remove":{
      if(["local","sd"].includes(val))break;
      H.state.sources=H.state.sources.filter(s=>s.id!==val);
      if(H.state.active===val)H.state.active="local";
      H.save();tab("sources");notify("已移出媒体来源");break;
    }
    case "package":go("package",val);break;
    case "enable-dialog":openDialog("enable",val);break;
    case "grant":H.state.packages[val]={installed:true,enabled:true};H.save();closeDialogs(false);render("new-instance");notify("示例包已启用");break;
    case "disable-pack":H.state.packages[val].enabled=false;H.save();render("switch-package");notify("插件已停用，配置和资料已保留");break;
    case "instance-form":openDialog("instance",val);break;
    case "save-instance":saveInstance(val);break;
    case "policy":go("policy",val);break;
    case "priority-add":if(!r.draft.order.includes(val))r.draft.order.push(val);render("save-policy");break;
    case "priority-drop":r.draft.order.splice(Number(val),1);render("policy-mode");break;
    case "priority-up":{
      const i=Number(val),o=r.draft.order;if(i>0)[o[i-1],o[i]]=[o[i],o[i-1]];render("up-"+Math.max(1,i-1));break;
    }
    case "save-policy":savePolicy(false);break;
    case "preview":savePolicy(true);break;
    case "pick-match":openDialog("matches",val);break;
    case "adopt":{
      const result=r.batch.rows.find(x=>x.id===topDialog().val);result.pick=val;closeDialogs(false);render("match-"+H.node(result.id).key);break;
    }
    case "apply":openDialog("apply");break;
    case "commit":{
      closeDialogs(false);
      try {const count=H.apply(r.batch);routes.pop();render("undo");notify(`已更新 ${count} 个字段，可撤销本次变更`);}
      catch(error){routes.pop();render("preview");notify(error.message);}
      break;
    }
    case "undo":{const result=H.undo(val);render("preview");notify(`已恢复 ${result.restored} 个字段${result.conflicts?`，保留 ${result.conflicts} 处后续修改`:""}`);break;}
    case "save-field":{
      const n=H.node(val),title=byId("manual-title").value.trim();
      if(!title){notify("请填写展示片名");break;}
      H.setField(n,"title",title,"手动编辑",byId("lock-title").checked);H.save();const key=returnKey;closeDialogs(false);render(key);notify("片名已保存");break;
    }
    case "item-info":openDialog("item",val);break;
    case "reset-dialog":openDialog("reset");break;
    case "reset":music.pause();H.reset();tab("library");notify("已恢复初始示例");break;
    case "play-toggle":playToggle();break;
    case "seek":seek(Number(val));break;
    case "tracks":openDialog("track");break;
    case "rate":openDialog("rate");break;
    case "set-rate":player.rate=Number(val);closeDialogs();updatePlayer();break;
    case "save-tracks":player.sub=byId("subtitle").value;player.audio=byId("audio-track").value;player.subSize=byId("caption-size").value;player.delay=byId("caption-delay").value;closeDialogs();updatePlayer();break;
    case "exit-player":closeDialogs(false);back();break;
    case "replay":closeDialogs(false);playToggle();focusKey("play-toggle");break;
    case "next-episode":{
      closeDialogs(false);stopPlayer();r.id=val;if(routes.at(-2)?.kind==="folder")routes.at(-2).lastFocus="node-"+val;render();break;
    }
    case "song":if(music.playing&&music.index===Number(val))music.pause();else music.play(Number(val),true);break;
    case "music-toggle":if(music.playing)music.pause();else music.play(music.index,false);break;
    case "music-next":music.play((music.index+1)%music.tracks.length,true);break;
    case "mini":if(r.kind!=="music")go("music");break;
  }
}
document.addEventListener("click",event=>{
  const b=event.target.closest("button[data-act]");
  if(b&&!b.disabled)act(b.dataset.act,b.dataset.val||"");
  else if(player&&!dialog.open){revealPlayer();focusKey("play-toggle");}
});
document.addEventListener("change",event=>{
  if(event.target.id==="policy-mode"){
    const r=current(),draft=r.draft;draft.mode=event.target.value;
    if(draft.mode==="custom"&&!draft.order.length)draft.order=[...H.state.policies.global.order];render("policy-mode");
  }
  if(event.target.id==="density"){H.state.density=event.target.value;H.save();document.documentElement.dataset.density=H.state.density;}
});
document.addEventListener("focusin",e=>{
  if(!dialog.open && current().kind==="library" && e.target.matches(".tile"))highlight(H.node(e.target.dataset.val));
});
dialog.addEventListener("cancel",e=>{e.preventDefault();back();});
stage.addEventListener("pointermove",()=>{if(player)revealPlayer();});

function move(dx,dy) {
  const container=dialog.open?dialog:byId("shell"),active=document.activeElement;
  const elements=[...container.querySelectorAll("button:not(:disabled),input,select")].filter(el=>el.getClientRects().length&&getComputedStyle(el).visibility!=="hidden");
  if(!elements.includes(active)){focusKey();return;}
  const r=active.getBoundingClientRect(),cx=(r.left+r.right)/2,cy=(r.top+r.bottom)/2;
  const options=[];
  for(const el of elements) {
    if(el===active)continue;
    const b=el.getBoundingClientRect(),x=(b.left+b.right)/2,y=(b.top+b.bottom)/2;
    const forward=dx?dx*(x-cx):dy*(y-cy),cross=dx?Math.abs(y-cy):Math.abs(x-cx);
    const overlap=dx?Math.min(r.bottom,b.bottom)-Math.max(r.top,b.top):Math.min(r.right,b.right)-Math.max(r.left,b.left);
    if(forward<3 || (overlap<=0 && cross>forward*1.3))continue;
    const score=(overlap>0?0:10000)+forward+cross*.45;
    options.push({score,el});
  }
  options.sort((a,b)=>a.score-b.score);
  if(options[0]){options[0].el.focus({preventScroll:true});options[0].el.scrollIntoView({block:"nearest",inline:"nearest"});}
}
function command(key,fromPad=false) {
  if(key==="back"){back();return;}
  if(!dialog.open && player) {
    if(key==="x"){openDialog("track");return;}
    if(key==="pause" || player.hidden&&key==="ok"){playToggle();return;}
    if(player.hidden){if(key==="left"||key==="right")seek(key==="left"?-10:10);else {revealPlayer();focusKey("play-toggle");}return;}
    revealPlayer();
  }
  if(!dialog.open){
    if(key==="y"){tab("sources");return;}
    if(key==="x"){contextAction();return;}
    if(key==="prev"||key==="next"){const it=tabs.indexOf(routes[0].kind);tab(tabs[(Math.max(0,it)+(key==="next"?1:3))%4]);return;}
  }
  const focused=document.activeElement;
  if(fromPad && focused.tagName==="SELECT" && ["left","right"].includes(key)){
    focused.selectedIndex=Math.max(0,Math.min(focused.length-1,focused.selectedIndex+(key==="right"?1:-1)));focused.dispatchEvent(new Event("change",{bubbles:true}));return;
  }
  if(key==="ok"){focused?.click();return;}
  const v={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[key];
  if(v)move(...v);
}
document.addEventListener("keydown",event=>{
  if(event.altKey||event.metaKey||event.ctrlKey)return;
  if(event.target.matches("select,input")&&event.key!=="Escape")return;
  const k={Escape:"back",Backspace:"back",Enter:"ok"," ":"pause",ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",x:"x",X:"x",y:"y",Y:"y","[":"prev","]":"next"}[event.key];
  if(!k || k==="pause"&&(!player||dialog.open))return;
  event.preventDefault();if(!event.repeat||["up","down","left","right"].includes(k))command(k);
});
let padHeld=new Set();const padRepeat=new Map();
function pollPad(clock) {
  let pads;try{pads=navigator.getGamepads?.();}catch{}
  const pad=pads&&[...pads].find(p=>p?.connected&&p.mapping==="standard"),now=new Set();
  if(pad&&!document.hidden) {
    for(const [i,k] of [[0,"ok"],[1,"back"],[2,"x"],[3,"y"],[4,"prev"],[5,"next"],[12,"up"],[13,"down"],[14,"left"],[15,"right"]])if(pad.buttons[i]?.pressed)now.add(k);
    if(pad.axes[0]<-.6)now.add("left");if(pad.axes[0]>.6)now.add("right");if(pad.axes[1]<-.6)now.add("up");if(pad.axes[1]>.6)now.add("down");
    for(const k of now)if(!padHeld.has(k)){command(k,true);padRepeat.set(k,clock+370);}else if(["up","down","left","right"].includes(k)&&clock>padRepeat.get(k)){command(k,true);padRepeat.set(k,clock+150);}
  }
  padHeld=now;requestAnimationFrame(pollPad);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&player){player.playing=false;recordPlayer();updatePlayer();revealPlayer();}});
window.addEventListener("pagehide",()=>{if(player)recordPlayer();music.dispose();});
render();requestAnimationFrame(pollPad);
