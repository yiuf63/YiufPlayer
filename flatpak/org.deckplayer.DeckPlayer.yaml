# ============================================================================
# DeckPlayer Flatpak manifest
#
# 重要：本 manifest 必须产出【许可干净】的构建。
#   - mpv 使用 -Dgpl=false（禁用 GPL-only 组件）
#   - FFmpeg 使用 --disable-gpl --disable-version3 --disable-nonfree
#   - 两者均动态链接
# 任何一项回归都会使产物受 GPL 约束，导致闭源分发不合规。
# 构建后请用 `flatpak run --command=sh org.deckplayer.DeckPlayer -c \
#   'strings /app/lib/libavutil.so* | grep -c GPL'` 之类手段复核。
# ============================================================================
# 构建前必读：本文件的 sha256 为占位符，需先执行
#   scripts/update-flatpak-sources.sh
# 填入真实哈希，否则 flatpak-builder 会因校验失败而中止。
# 这样做是为了避免手写错误的哈希被误当成真值使用。
app-id: org.deckplayer.DeckPlayer

runtime: org.freedesktop.Platform
# 使用仍在维护的 LTS 分支。23.08 已于 2025 年停止支持。
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18

command: deck-player

finish-args:
  # --- 显示 ---
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # --- 音频 ---
  - --socket=pulseaudio
  # --- 硬件解码与图形加速 ---
  - --device=dri
  - --device=all
  # --- 网络：插件（视频源 / 刮削器）需要访问网络 ---
  - --share=network
  # --- 媒体库：需要读取用户媒体目录与可移动存储 ---
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --filesystem=/run/media
  - --filesystem=/media
  # --- 插件与配置目录 ---
  - --filesystem=xdg-config/deck-player:create
  # --- 播放时阻止屏幕休眠 ---
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager

modules:
  # --------------------------------------------------------------------------
  # FFmpeg（LGPL 构建）
  # --disable-gpl 是硬性要求；--disable-version3 防止组件升级到 GPLv3。
  # --------------------------------------------------------------------------
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-gpl
      - --disable-version3
      - --disable-nonfree
      - --disable-static
      - --enable-shared
      - --disable-programs
      - --disable-doc
      - --disable-debug
      - --enable-vaapi
      - --enable-vdpau
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        # ⚠️ 占位符，构建前必须替换为真实哈希。
        # 获取方法见 flatpak/README.md，或执行：
        #   scripts/update-flatpak-sources.sh
        sha256: REPLACE_WITH_REAL_SHA256_OF_FFMPEG_7.1

  # --------------------------------------------------------------------------
  # libmpv（LGPL 构建）
  # --------------------------------------------------------------------------
  - name: mpv
    buildsystem: meson
    config-opts:
      # 关键：不带此选项会默认编译 GPL-only 组件
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dvaapi=enabled
      - -Dvdpau=enabled
      - -Djack=disabled
      - -Dpulse=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        # ⚠️ 占位符，构建前必须替换为真实哈希。
        sha256: REPLACE_WITH_REAL_SHA256_OF_MPV_0.39.0

  # --------------------------------------------------------------------------
  # DeckPlayer 本体
  # --------------------------------------------------------------------------
  - name: deck-player
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # 指向本次构建的 LGPL 版 libmpv，避免误用系统 GPL 版
      - -DMPV_ROOT=/app
      # 注：旧的 -DALLOW_GPL_LINKAGE 开关已随闭源约束一并移除；
      # 构建期许可证探针现在只打印信息，不中止构建。
    sources:
      - type: dir
        path: ..
