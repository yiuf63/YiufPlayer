<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    DeckPlayer 图标 —— 参考 SteamOS 的克制风格：深蓝底、单色几何剪影、单一强调色。

    构成（仅 6 个图元）：
      1. 机身   —— 横向圆角矩形，接近 Steam Deck 的 2.6:1 比例
      2. 握把×2 —— 贴在机身左右下角，短而圆，形成掌机剪影
      3. 屏幕   —— 用背景色挖空，负空间即屏幕
      4. 三角   —— Steam 蓝，同时是「屏幕画面」与「播放」

    刻意省略：十字键、摇杆、按键、橙色。
    这些在 32px 以下会退化成噪点，掌机的身份靠外轮廓即可承载。

    对齐：剪影中心 (255.5, 260.5)、三角中心 (256.0, 244.5)，画布中心 (256,256)。
    三角落在屏幕垂直中线 245 上，视觉上是居中的。
  -->
  <rect width="512" height="512" rx="112" fill="#1B2838"/>
  <g fill="#F2F5F8">
    <rect x="96" y="170" width="320" height="150" rx="56"/>
    <rect x="92" y="248" width="104" height="104" rx="44"/>
    <rect x="316" y="248" width="104" height="104" rx="44"/>
  </g>
  <rect x="150" y="196" width="212" height="98" rx="14" fill="#1B2838"/>
  <path fill="#66C0F4" d="M 220 202 L 220 288 L 294 245 Z"/>
</svg>
