name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（若手动触发且无 tag 请输入，如 v0.7.0）'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── 1. Linux 构建（Steam Deck / Linux x86_64）──
  build-linux:
    name: 构建 Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libavutil-dev libavformat-dev libavcodec-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libglfw3-dev libfmt-dev libtinyxml2-dev libdbus-1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: 编译 libromfs 生成器
        run: bash scripts/build-libromfs-generator.sh

      - name: 准备 romfs 资源
        run: bash scripts/prepare-romfs.sh

      - name: 配置
        run: |
          cmake -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_SYSTEM_GLFW=OFF

      - name: 编译
        run: cmake --build build-linux -j$(nproc)

      - name: 验证二进制
        run: |
          file build-linux/muvik
          echo "--- 检查未定义符号 ---"
          ldd -r build-linux/muvik 2>&1 | grep "undefined symbol" && exit 1 || true

      - name: 打包 Linux 发行包
        run: |
          mkdir -p pkg/muvik-linux-x86_64
          cp build-linux/muvik pkg/muvik-linux-x86_64/
          cp -r resources pkg/muvik-linux-x86_64/
          cp -r steam pkg/muvik-linux-x86_64/ 2>/dev/null || true
          cp scripts/add_to_steam.py pkg/muvik-linux-x86_64/ 2>/dev/null || true
          cp README.md LICENSE THIRD-PARTY-NOTICES.md pkg/muvik-linux-x86_64/
          cd pkg
          tar -czvf ../muvik-linux-x86_64.tar.gz muvik-linux-x86_64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: muvik-linux-x86_64.tar.gz
          retention-days: 7

  # ── 2. macOS 构建（Apple Silicon arm64）──
  build-macos:
    name: 构建 macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install mpv ffmpeg fmt tinyxml2

      - name: 配置
        run: |
          cmake -B build-macos -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build-macos -j$(sysctl -n hw.ncpu)

      - name: 单元测试自检
        run: ./tests/run_tests.sh

      - name: 打包 macOS 发行包
        run: |
          mkdir -p pkg/muvik-macos-arm64
          cp build-macos/muvik pkg/muvik-macos-arm64/
          cp -r resources pkg/muvik-macos-arm64/
          cp README.md LICENSE THIRD-PARTY-NOTICES.md pkg/muvik-macos-arm64/
          cd pkg
          zip -r ../muvik-macos-arm64.zip muvik-macos-arm64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: muvik-macos-arm64.zip
          retention-days: 7

  # ── 3. Android 构建（arm64-v8a APK）──
  build-android:
    name: 构建 Android (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 libromfs 生成器
        run: bash scripts/build-libromfs-generator.sh

      - name: 准备 romfs 资源
        run: bash scripts/prepare-romfs.sh

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: 生成 local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 安装 Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: 构建 Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 整理 APK 产物
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk muvik-android-arm64.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: muvik-android-arm64.apk
          retention-days: 7

  # ── 4. TrimUI Smart Pro 构建（Linux aarch64 / SDL2）──
  build-trimui:
    name: 构建 TrimUI Smart Pro (tg5040 aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 准备 QEMU 与 Docker 环境
        uses: docker/setup-qemu-action@v3
      - name: 编译 aarch64 二进制
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src ubuntu:20.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config git \
              python3 python3-pip \
              libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev \
              libmpv-dev libavutil-dev libavformat-dev libavcodec-dev libswscale-dev \
              libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev
            pip3 install cmake
            cmake -B build-trimui -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPLATFORM_DESKTOP=ON \
              -DUSE_SDL2=ON \
              -DUSE_SYSTEM_SDL2=ON \
              -DMUVIK_USE_GLES3=ON \
              -DMUVIK_USE_EGL=ON
            cmake --build build-trimui -j$(nproc)
          '
      - name: 打包 TrimUI 安装包
        run: |
          mkdir -p package/Muvik
          cp build-trimui/muvik package/Muvik/
          cp -r resources package/Muvik/
          cp resources/icon/icon-300.png package/Muvik/icon.png 2>/dev/null || cp resources/icon/icon-512.png package/Muvik/icon.png
          cat > package/Muvik/config.json << 'EOF'
          {
            "label": "Muvik",
            "label.ch.lang": "Muvik 播放器",
            "icon": "icon.png",
            "launch": "launch.sh",
            "description": "手柄优先的媒体播放器 (libmpv + Borealis)"
          }
          EOF
          cat > package/Muvik/launch.sh << 'EOF'
          #!/bin/sh
          BIN_PATH=$(dirname "$0")
          cd "$BIN_PATH"
          export PATH="/mnt/SDCARD/System/bin:/usr/trimui/bin:$PATH"
          export LD_LIBRARY_PATH="$BIN_PATH/lib:/usr/lib64:/lib64:/mnt/SDCARD/System/lib:/usr/trimui/lib:$LD_LIBRARY_PATH"
          export XDG_CONFIG_HOME="$BIN_PATH/config"
          export MUVIK_RESOURCES="$BIN_PATH/resources"
          mkdir -p "$BIN_PATH/config"
          ./muvik >> log.txt 2>&1
          sync
          EOF
          chmod +x package/Muvik/launch.sh package/Muvik/muvik
          cd package && tar -czf ../muvik-tg5040-aarch64.tar.gz Muvik
      - name: 上传 TrimUI 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-trimui
          path: muvik-tg5040-aarch64.tar.gz

  # ── 5. 发布 GitHub Release ──
  publish-release:
    name: 发布 GitHub Release
    needs: [build-linux, build-macos, build-android, build-trimui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇集发布文件
        run: |
          mkdir -p dist
          cp artifacts/release-linux/muvik-linux-x86_64.tar.gz dist/
          cp artifacts/release-macos/muvik-macos-arm64.zip dist/
          cp artifacts/release-android/muvik-android-arm64.apk dist/
          cp artifacts/release-trimui/muvik-tg5040-aarch64.tar.gz dist/
          echo "=== 待发布文件列表 ==="
          ls -lh dist/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
