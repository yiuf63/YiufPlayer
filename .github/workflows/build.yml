name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 单元测试 + 文档一致性（最快，先跑）──
  test-macos:
    name: 单元测试与文档检查
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install mpv ffmpeg fmt tinyxml2

      - name: 配置
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: 单元测试
        run: ./tests/run_tests.sh

      - name: 文档与实现一致性
        run: python3 tests/tools/check_docs.py

      - name: 字体格式校验
        run: python3 scripts/check_font.py

      - name: 头文件完整性（Linux 兼容性守卫）
        run: python3 scripts/check_includes.py

  # ── 2. Linux 构建（Steam Deck 目标，验证编译与链接）──
  # 注意：这里只验证「能编译、能链接」。
  # 真实渲染与硬件解码必须在 Steam Deck 实机验证，
  # 因为 CI runner 没有 GPU。
  build-linux:
    name: Linux 构建（x86_64）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libavutil-dev libavformat-dev libavcodec-dev \
            libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libglfw3-dev libfmt-dev libtinyxml2-dev libdbus-1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: 编译 libromfs 生成器
        # 它是**宿主机**工具（把资源打成 C++ 源码），不能入库：
        # macOS 编的是 Mach-O，Linux runner 无法执行。
        run: bash scripts/build-libromfs-generator.sh

      - name: 准备 romfs 资源
        run: bash scripts/prepare-romfs.sh

      - name: 配置
        # USE_SYSTEM_GLFW=OFF：必须用 borealis 的定制 GLFW 分支
        # （含 GLFW_SOFT_FULLSCREEN / GLFW_TOUCH / GLFW_IME），
        # 系统 libglfw3 没有这些符号，会在编译期报错。
        run: |
          cmake -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM_DESKTOP=ON \
            -DUSE_SYSTEM_GLFW=OFF

      - name: 编译
        run: cmake --build build-linux -j$(nproc)

      - name: 验证产物
        run: |
          file build-linux/muvik
          echo "--- 检查未定义符号 ---"
          ldd -r build-linux/muvik 2>&1 | grep "undefined symbol" && exit 1 || true
          echo "--- 检查关键依赖 ---"
          ldd build-linux/muvik | grep -E "mpv|avutil|glfw|GL" || exit 1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: muvik-linux-x86_64
          path: build-linux/muvik
          retention-days: 14

  # ── 3. Android 构建（触屏交互的主要验证平台）──
  build-android:
    name: Android 构建（arm64）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 libromfs 生成器
        # 同 Linux job：宿主机工具，必须现编
        run: bash scripts/build-libromfs-generator.sh

      - name: 准备 romfs 资源
        run: bash scripts/prepare-romfs.sh

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: 生成 local.properties
        run: |
          # 只写 sdk.dir。不要写 ndk.dir —— Gradle 会按 app/build.gradle
          # 里的 android.ndkVersion 自动定位 NDK；
          # 手写 ndk.dir 若版本不一致会直接报 CXX1104。
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 安装 Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.x 不支持 Gradle 9。runner 自带的 gradle 版本太新。
          #
          # 注意：这里**不要**设置 validate-wrappers ——
          # 本仓库的 android/gradlew 是自写的转发脚本（不是官方 wrapper，
          # 没有 gradle-wrapper.jar），wrapper 校验会直接判失败：
          #   "At least one Gradle Wrapper Jar failed validation!"
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: 构建 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: muvik-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
